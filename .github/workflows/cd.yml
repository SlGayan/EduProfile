name: CD Pipeline

# Triggers on every push to main.
# Branch protection on `main` guarantees the CI pipeline already passed before merge,
# so this workflow does NOT need to re-run lint/test/build steps.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Build Docker images and push to ghcr.io
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to ghcr.io
    outputs:
      api-image: ${{ steps.image-names.outputs.api }}
      web-image: ${{ steps.image-names.outputs.web }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve lowercase image names
        id: image-names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "api=${{ env.REGISTRY }}/$OWNER/eduprofile-api" >> $GITHUB_OUTPUT
          echo "web=${{ env.REGISTRY }}/$OWNER/eduprofile-web" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── API image ──────────────────────────────────────────────
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.image-names.outputs.api }}:latest
            ${{ steps.image-names.outputs.api }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # ── Web image ──────────────────────────────────────────────
      # API_URL is required at build time so Next.js rewrites() resolve
      # correctly in the standalone output (see apps/web/Dockerfile).
      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.image-names.outputs.web }}:latest
            ${{ steps.image-names.outputs.web }}:${{ github.sha }}
          build-args: |
            API_URL=${{ secrets.AZURE_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ─────────────────────────────────────────────────────────────
  # 2a. Deploy API container to Azure App Service
  # ─────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API image to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_API_APP_NAME }}
          images: ${{ needs.build-and-push.outputs.api-image }}:${{ github.sha }}

  # ─────────────────────────────────────────────────────────────
  # 2b. Deploy Web container to Azure App Service (parallel)
  # ─────────────────────────────────────────────────────────────
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Web image to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEB_APP_NAME }}
          images: ${{ needs.build-and-push.outputs.web-image }}:${{ github.sha }}

  # ─────────────────────────────────────────────────────────────
  # 3. Run Prisma migrations against Azure PostgreSQL
  #
  # Runs from the GitHub Actions runner — no SSH into the container
  # required (and F1 free tier doesn't support it anyway).
  # Runs after deploy-api so the API slot is warming up while
  # migrations execute.
  # ─────────────────────────────────────────────────────────────
  run-migrations:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: deploy-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate

      - name: Wait for API container to stabilize
        # Give Azure App Service time to pull and start the new image
        # before migrations run (avoids connection race on cold start)
        run: sleep 30

      - name: Apply Prisma migrations
        run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
